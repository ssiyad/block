{# cards.js puts the latest own post here when the page loads #}
{% set handle = config.extra.bluesky.handle %}
<article class="island card rise" style="--i: 4" data-bluesky="{{ handle }}">
  <div class="card-head">
    <span class="kicker">Bluesky</span>
    <a class="meta" href="https://bsky.app/profile/{{ handle }}"
      >@{{ handle }}</a
    >
  </div>
  <a
    class="card-quote"
    href="https://bsky.app/profile/{{ handle }}"
    data-bsky-quote
  >
    Latest posts on Bluesky →
  </a>
  <div class="card-foot" data-bsky-foot hidden>
    <time data-bsky-time></time>
    <span data-bsky-counts></span>
  </div>
</article>
