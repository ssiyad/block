# The URL the site will be built for
base_url = "/"

# Title of the site
title = "Musings of a Curious Mind"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

[markdown.highlighting]
# Syntax highlighting theme. See https://github.com/getzola/giallo#built-in
theme = "gruvbox-dark-medium"

[extra]
# Put all your custom variables here

[extra.intro]
heading = "Blog theme for Zola, in Acid Citric"
subheading = "Thoughts, stories and ideas."
avatar_url = "https://picsum.photos/200"

[extra.footer]
license_text = "The content under this site is MIT licensed."

